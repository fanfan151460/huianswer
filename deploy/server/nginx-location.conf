# Included inside the existing port-80 server for 8.149.237.177.
location = /huianswer {
    return 308 /huianswer/;
}
location ^~ /huianswer/api/evaluation/ {
    return 404;
}
location = /huianswer/api/hui-answer/login {
    limit_req zone=huianswer_login burst=3 nodelay;
    limit_req_status 429;
    include /etc/huianswer/nginx-proxy.conf;
    proxy_pass http://127.0.0.1:8084/api/hui-answer/login;
}
location = /huianswer/hui-ansWer/chat/stream {
    limit_req zone=huianswer_chat burst=2 nodelay;
    limit_req_status 429;
    limit_conn huianswer_connections 2;
    limit_conn_status 429;
    include /etc/huianswer/nginx-proxy.conf;
    proxy_pass http://127.0.0.1:8084/hui-ansWer/chat/stream;
}
location ^~ /huianswer/api/ {
    include /etc/huianswer/nginx-proxy.conf;
    proxy_pass http://127.0.0.1:8084/api/;
}
location ^~ /huianswer/assets/ {
    root /opt/huianswer/web/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /huianswer/ {
    root /opt/huianswer/web/current;
    index index.html;
    try_files $uri $uri/ /huianswer/index.html;
    add_header Cache-Control "no-cache";
}
