server:
  port: ${HUIANSWER_PORT:8080}

spring:
  application:
    name: huianswer-rag
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # 上传临时文件也放到 D 盘。Spring Boot 启动时会创建该目录。
      location: ${HUIANSWER_UPLOAD_TEMP_DIR:D:/develop/huiAnswer/data/tmp}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${HUIANSWER_DB_URL:jdbc:postgresql://localhost:5432/huianswer?reWriteBatchedInserts=true}
    username: ${HUIANSWER_DB_USERNAME:postgres}
    password: ${HUIANSWER_DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${HUIANSWER_MQ_NAMESERVER:127.0.0.1:9876}
  producer:
    group: ${HUIANSWER_MQ_PRODUCER_GROUP:huiAnswer-rag-document-service}
    topic: ${HUIANSWER_MQ_TOPIC:huiAnswer-rag-documentToChunk-topic}
    send-message-timeout: 5000
    # 同步发送由 DocumentProducer 统一退避重试，避免与客户端重试叠加。
    retry-times-when-send-failed: 0
    retry-initial-delay-ms: 200
    retry-times-when-send-async-failed: 1
  consumer:
    group: ${HUIANSWER_MQ_CONSUMER_GROUP:huiAnswer-rag-chunks-service}

rag:
  ingestion:
    mq-enabled: true
  storage:
    local-root: ${HUIANSWER_STORAGE_DIR:D:/develop/huiAnswer/data/documents}
  parse:
    max-characters: 1000000
  vector:
    # 与 sql/01_knowledge.sql 的 vector(4096) 对齐；改模型维度时需要同时迁移表。
    dimension: 4096
    metric-type: COSINE
  # 每个子问题：向量、关键词两路各召回最多 20 块，RRF 融合后保留最多 10 块候选。
  search:
    topK: 20
    mix-search-count: 10
    max-distance: 0.6
  # RRF 的 k 值，越大越弱化高名次的优势；60 是常用取值
  rrf-k: 60
  rerank:
    # 全部子问题共享的最终资料上限，控制回答提示词中的片段数量。
    top-n: 6
    timeout-seconds: 15
  rewrite:
    # 一次返回完整改写和子问题列表，输出预算需容纳 JSON 结构。
    max-tokens: 512
    temperature: 0.1
    timeout-seconds: 10
  intent:
    # 每个子问题独立分类、选库；超时或结果无效时仅降级该子问题。
    max-tokens: 512
    temperature: 0.0
    timeout-seconds: 10
  chat:
    # sse连接时长（ms）限制
    max-sse: 300000
    max-model-wait: 180
    # 每个实例每秒批量读取自己的生成停止标记。
    stop-check-interval-ms: 1000
    # 须大于 SSE 时限，实例异常退出后也能自动回收任务记录。
    generation-ttl-seconds: 600
    # 单次回答的最大生成 token。撞到上限时 finish_reason=length，按成功处理并留在历史里。
    answer-max-tokens: 2048
    answer-temperature: 0.3
  ai:
    provider: siliconflow
    siliconflow:
      url: ${HUIANSWER_AI_URL:https://api.siliconflow.cn}
      # OpenAI 兼容协议的端点路径，只有 host 由上面的 url 提供
      chat-path: /v1/chat/completions
      embeddings-path: /v1/embeddings
      rerank-path: /v1/rerank
      api-key: ${HUIANSWER_AI_API_KEY:}
      chat-model: ${HUIANSWER_CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
      rerank-model: ${HUIANSWER_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      embedding-model: ${HUIANSWER_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
      # 每次 HTTP 请求的文本块数量，与数据库写入批次独立。
      embedding-batch-size: 32
      embedding-timeout-seconds: 60
  chunk:
    chunk-size: 500
    OVERLAP: 100
  memory:
    summary: true
    turns: 8
    # 开始压缩的对话消息数量（两倍的轮次）必须为偶数
    summary-batch-messages: 6
    # 摘要生成的预算需容纳「旧摘要 + 本次新增」的压缩结果，滚动压缩会越压越长，要留余量。
    summary-max-tokens: 2048
    summary-temperature: 0.2